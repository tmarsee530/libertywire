name: Rally Point Maintenance

on:
  push:
    branches: [main]
    paths:
      - 'feeds.json'
      - 'requirements.txt'
      - 'scripts/fetch_news.py'
      - 'scripts/run_newsroom.py'
      - 'scripts/verify_core_publication.py'
      - 'scripts/stage_publication.py'
      - 'scripts/build_breaking_fast_path.py'
      - 'scripts/timeline_intelligence.py'
      - 'tests/test_breaking_fast_path.py'
      - 'tests/test_timeline_product.py'
      - 'tests/test_timeline_state.js'
      - 'tests/test_reliability_hardening.py'
      - 'assets/timeline-state.js'
      - 'assets/following.js'
      - 'RETENTION_ANALYTICS.md'
      - 'NOTIFICATION_FOUNDATION.md'
      - 'scripts/build_notification_foundation.py'
      - 'tests/test_notification_foundation.py'
      - 'data/server_follows.json'
      - 'email-service/**'
      - 'assets/email-opt-in.js'
      - 'scripts/publish_email_events.py'
      - 'tests/test_email_pilot.py'
      - 'data/email_pilot_config.json'
      - 'scripts/build_storylines.py'
      - 'scripts/event_identity.py'
      - 'scripts/canonical_ownership.py'
      - 'scripts/build_history.py'
      - 'scripts/build_timelines.py'
      - 'scripts/install_homepage_v2.py'
      - 'scripts/install_discovery_metadata.py'
      - 'scripts/build_sitemaps.py'
      - 'assets/homepage-v2.js'
      - 'assets/homepage-v2.css'
      - 'assets/timeline.css'
      - '.github/workflows/newsroom.yml'
      - '.github/workflows/wire-fast.yml'
      - '.github/workflows/wire-watchdog.yml'
  workflow_dispatch:

permissions:
  contents: write

# Scheduled headline refreshes and all production writes belong to wire-fast.yml.
# This workflow validates code/configuration changes without competing for main.
concurrency:
  group: rally-point-maintenance
  cancel-in-progress: true

jobs:
  maintain-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Synchronize with latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Verify publisher and reliability code before maintenance
        run: python -m py_compile scripts/run_newsroom.py scripts/stage_publication.py scripts/verify_core_publication.py scripts/fetch_news.py scripts/build_breaking_fast_path.py scripts/event_identity.py scripts/canonical_ownership.py scripts/timeline_intelligence.py scripts/build_history.py scripts/build_storylines.py scripts/build_timelines.py scripts/build_archive.py scripts/build_notification_foundation.py scripts/publish_email_events.py scripts/build_recent.py scripts/build_feed.py scripts/build_distribution_candidates.py scripts/build_sitemaps.py scripts/install_homepage_v2.py scripts/install_discovery_metadata.py
      - name: Test fast path and core timeline product
        run: |
          python -m unittest discover -s tests -v
          node --test tests/test_timeline_state.js
          node --test email-service/test/*.test.js
      - name: Run resilient maintenance pipeline
        run: python scripts/run_newsroom.py --mode maintenance
      - name: Verify timeline-first homepage integrity
        run: |
          test -s data/published_timelines.json
          test -s data/newsroom_health.json
          test -s data/newsroom_dead_letters.json
          test -s data/breaking_fast_path.json
          test -s health/index.html
          test -s data/notification_health.json
          test -s data/notification_queue.json
          test -s notification-health/index.html
          grep -q '"delivery_enabled": false' data/notification_queue.json
          test -s data/email_pilot_config.json
          test -s data/email_delivery_health.json
          test -s assets/email-opt-in.js
          grep -q 'data-email-pilot hidden' stories/*/index.html
          ! grep -Eq '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}' data/email_delivery_health.json data/notification_health.json data/notification_queue.json
          python - <<'PY'
          import json,re
          from pathlib import Path
          fast=json.loads(Path('data/breaking_fast_path.json').read_text())
          assert fast.get('policy',{}).get('normal_path_preserved') is True
          assert fast.get('policy',{}).get('ideology_used_in_scoring') is False
          ids=set(json.loads(Path('data/published_timelines.json').read_text()).get('ids',[]))
          history={x.get('id'):x for x in json.loads(Path('data/history.json').read_text()).get('storylines',[])}
          for sid in ids:
              page=(Path('stories')/sid/'index.html').read_text()
              assert f'<link rel="canonical" href="https://rallypointnews.com/stories/{sid}/">' in page
              assert 'Current status' in page and 'NEWEST FIRST' in page
              dates=re.findall(r'class="timeline-update[^>]*" data-published="([^"]+)"',page)
              assert dates == sorted(dates,reverse=True), f'timeline is not newest first: {sid}'
              record=history.get(sid)
              if record:
                  assert record.get('current_status') and record.get('material_update_count') == len(record.get('updates',[]))
          body=Path('index.html').read_text()
          links=set(re.findall(r'href="/stories/([a-f0-9]{12})/"',body))
          assert links <= ids, f'homepage links to unpublished timelines: {sorted(links-ids)}'
          for sid in links:
              assert (Path('stories')/sid/'index.html').exists(), f'missing timeline page: {sid}'
          PY
      - name: Enforce newsroom health gate
        if: always()
        run: python scripts/run_newsroom.py --assert-healthy
