name: Email Pilot Service

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy after tests (requires configured Cloudflare secrets)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: rally-point-email-service
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: email-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/*.test.js
      - name: Deploy Worker
        if: inputs.deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.38.0 deploy
