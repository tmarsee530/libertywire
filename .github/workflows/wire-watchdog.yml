name: Fast Wire Watchdog

on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  recover-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Recover Fast Wire only when its lease is stale
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUNS="$(curl --fail-with-body -sS -L \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/wire-fast.yml/runs?per_page=10")"
          ACTIVE="$(jq '[.workflow_runs[] | select(.status == "queued" or .status == "in_progress" or .status == "pending")] | length' <<<"$RUNS")"
          LATEST="$(jq -r '[.workflow_runs[] | select(.conclusion != "cancelled")][0].created_at // empty' <<<"$RUNS")"
          if [ "$ACTIVE" -gt 0 ]; then
            echo "Fast Wire has an active lease; watchdog is idle."
            exit 0
          fi
          if [ -n "$LATEST" ]; then
            AGE="$(( $(date -u +%s) - $(date -u -d "$LATEST" +%s) ))"
            if [ "$AGE" -lt 480 ]; then
              echo "Fast Wire completed recently (${AGE}s); allow its handoff to arrive."
              exit 0
            fi
          fi
          echo "Fast Wire lease is stale; dispatching one recovery tick."
          curl --fail-with-body -sS -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/dispatches" \
            -d '{"event_type":"fast_wire_tick","client_payload":{"source":"cron_watchdog"}}'
