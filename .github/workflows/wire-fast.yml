name: Fast Wire Refresh

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rally-point-wire-fast
  cancel-in-progress: true

jobs:
  refresh-wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Synchronize with latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install ingestion dependencies
        run: pip install -r requirements.txt
      - name: Fetch newest headlines
        run: python scripts/fetch_news.py
      - name: Re-rank live storylines
        run: python scripts/build_storylines.py
      - name: Preserve developing-story history
        run: python scripts/build_history.py
      - name: Publish source-backed live timelines
        run: python scripts/build_timelines.py
      - name: Server-render current homepage headlines
        run: python scripts/install_homepage_v2.py
      - name: Refresh homepage search metadata
        run: python scripts/install_discovery_metadata.py
      - name: Build recent-headlines utility
        run: python scripts/build_recent.py
      - name: Refresh crawl discovery
        run: python scripts/build_sitemaps.py
      - name: Verify generated publication surfaces
        run: |
          test -s recent/index.html
          grep -q 'https://rallypointnews.com/recent/' sitemap.xml
          grep -q 'Recent Headlines' recent/index.html
          test -s stories/index.html
          grep -q 'Live News Timelines' stories/index.html
          grep -q 'G-KKT59K667B' stories/index.html
          grep -q 'G-KKT59K667B' recent/index.html
          grep -q 'https://rallypointnews.com/stories/' sitemap.xml\n          grep -q 'ItemListOrderDescending' scripts/build_timelines.py
          python - <<'PY'
          import re
          from pathlib import Path
          for page in (Path('index.html'), Path('stories/index.html')):
              body=page.read_text()
              for sid in re.findall(r'href="/stories/([a-f0-9]{12})/"',body):
                  assert (Path('stories')/sid/'index.html').exists(), f'broken timeline link in {page}: {sid}'
          sitemap=Path('sitemap.xml').read_text()
          for target in Path('stories').glob('*/index.html'):
              sid=target.parent.name
              assert f'https://rallypointnews.com/stories/{sid}/' in sitemap, f'timeline missing from sitemap: {sid}'
          PY
          python -m py_compile scripts/build_history.py scripts/build_storylines.py scripts/build_timelines.py scripts/build_recent.py scripts/build_sitemaps.py
          python - <<'PY'
          import json
          from datetime import datetime, timezone, timedelta
          h=json.load(open('data/history.json'))
          limit=datetime.now(timezone.utc)+timedelta(minutes=11)
          for s in h.get('storylines',[]):
              dates=[s.get('last_seen')]+[x.get('date') for x in s.get('coverage',[])]+[x.get('at') for x in s.get('changes',[])]
              for value in filter(None,dates):
                  dt=datetime.fromisoformat(value.replace('Z','+00:00'))
                  assert dt <= limit, f'future timestamp survived normalization: {value}'
          PY
      - name: Commit fresh Wire and crawlable homepage when changed
        run: |
          if [ -z "$(git status --porcelain -- index.html recent/index.html stories assets/timeline.css data/news.json data/storylines.json data/history.json sitemap.xml news-sitemap.xml)" ]; then
            echo "No headline or discovery changes."
            exit 0
          fi
          git config user.name "rally-point-wire[bot]"
          git config user.email "rally-point-wire[bot]@users.noreply.github.com"
          git add index.html recent/index.html stories assets/timeline.css data/news.json data/storylines.json data/history.json sitemap.xml news-sitemap.xml
          git commit -m "Refresh live Wire headlines"
          git fetch origin main
          PARENT_SHA="$(git rev-parse HEAD^)"
          REMOTE_SHA="$(git rev-parse origin/main)"
          if [ "$PARENT_SHA" != "$REMOTE_SHA" ]; then
            echo "main advanced during this refresh; skipping stale Wire push."
            exit 0
          fi
          git push origin HEAD:main
