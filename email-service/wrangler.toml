name = "rally-point-email-pilot"
main = "src/worker.js"
compatibility_date = "2026-09-01"
workers_dev = true

[triggers]
crons = ["*/2 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "rally-point-email"
database_id = "5a4e42d7-2dea-45b1-b789-431be9923ea7"

[vars]
SITE_ORIGIN = "https://rallypointnews.com"
PUBLIC_ORIGIN = "https://alerts.rallypointnews.com"
EMAIL_FROM = "Rally Point News <alerts@notify.rallypointnews.com>"
DELIVERY_ENABLED = "false"
