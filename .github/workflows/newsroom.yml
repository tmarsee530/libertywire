name: Rally Point Maintenance

on:
  push:
    branches: [main]
    paths:
      - 'feeds.json'
      - 'requirements.txt'
      - 'scripts/fetch_news.py'
      - 'scripts/build_storylines.py'
      - 'scripts/build_history.py'
      - 'scripts/build_timelines.py'
      - 'scripts/install_homepage_v2.py'
      - 'scripts/install_discovery_metadata.py'
      - 'scripts/build_sitemaps.py'
      - 'assets/homepage-v2.js'
      - 'assets/homepage-v2.css'
      - 'assets/timeline.css'
      - '.github/workflows/newsroom.yml'
  workflow_dispatch:

permissions:
  contents: write

# Scheduled headline refreshes belong to wire-fast.yml. This workflow now exists
# only for code/configuration changes that require homepage/search maintenance.
concurrency:
  group: rally-point-maintenance
  cancel-in-progress: true

jobs:
  maintain-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Synchronize with latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Verify publisher code before maintenance
        run: python -m py_compile scripts/build_history.py scripts/build_storylines.py scripts/build_timelines.py scripts/build_sitemaps.py scripts/install_homepage_v2.py scripts/install_discovery_metadata.py
      - name: Refresh current headline data
        run: python scripts/fetch_news.py
      - name: Re-rank current storylines
        run: python scripts/build_storylines.py
      - name: Preserve developing-story history
        run: python scripts/build_history.py
      - name: Publish source-backed live timelines
        run: python scripts/build_timelines.py
      - name: Install homepage presentation
        run: python scripts/install_homepage_v2.py
      - name: Install discovery metadata
        run: python scripts/install_discovery_metadata.py
      - name: Build current sitemaps
        run: python scripts/build_sitemaps.py
      - name: Commit current-site changes when needed
        run: |
          if [ -z "$(git status --porcelain -- index.html stories assets/timeline.css sitemap.xml news-sitemap.xml data/news.json data/storylines.json data/history.json)" ]; then
            echo "Current site is unchanged."
            exit 0
          fi
          git config user.name "rally-point-maintenance[bot]"
          git config user.email "rally-point-maintenance[bot]@users.noreply.github.com"
          git add index.html stories assets/timeline.css sitemap.xml news-sitemap.xml data/news.json data/storylines.json data/history.json
          git commit -m "Maintain Rally Point front page"
          git fetch origin main
          PARENT_SHA="$(git rev-parse HEAD^)"
          REMOTE_SHA="$(git rev-parse origin/main)"
          if [ "$PARENT_SHA" != "$REMOTE_SHA" ]; then
            echo "main advanced during maintenance; skipping stale push."
            exit 0
          fi
          git push origin HEAD:main
