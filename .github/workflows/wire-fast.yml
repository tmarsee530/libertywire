name: Fast Wire Refresh

on:
  workflow_dispatch:
  repository_dispatch:
    types: [fast_wire_tick]

permissions:
  contents: write

concurrency:
  group: rally-point-wire-fast
  # One refresh may run and one may wait. A new tick must never kill a healthy
  # publisher that is seconds away from committing verified newsroom state.
  cancel-in-progress: false

jobs:
  refresh-wire:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Synchronize with latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install ingestion dependencies
        run: pip install -r requirements.txt
      - name: Verify publisher and reliability code before fetching
        run: python -m py_compile scripts/run_newsroom.py scripts/fetch_news.py scripts/timeline_intelligence.py scripts/build_history.py scripts/build_storylines.py scripts/build_timelines.py scripts/install_homepage_v2.py scripts/verify_core_publication.py scripts/stage_publication.py
      - name: Check auxiliary code without blocking publication
        continue-on-error: true
        run: python -m py_compile scripts/build_breaking_fast_path.py scripts/build_archive.py scripts/build_notification_foundation.py scripts/publish_email_events.py scripts/build_recent.py scripts/build_feed.py scripts/build_distribution_candidates.py scripts/build_sitemaps.py scripts/install_discovery_metadata.py
      - name: Run resilient live-news pipeline
        run: python scripts/run_newsroom.py --mode fast
      - name: Publish eligible events to email pilot
        continue-on-error: true
        env:
          EMAIL_PILOT_API_URL: ${{ secrets.EMAIL_PILOT_API_URL }}
          EMAIL_PILOT_INGEST_SECRET: ${{ secrets.EMAIL_PILOT_INGEST_SECRET }}
        run: python scripts/publish_email_events.py
      - name: Verify core publication surfaces
        run: python scripts/verify_core_publication.py
      - name: Check auxiliary publication surfaces
        continue-on-error: true
        run: |
          test -s recent/index.html
          test -s health/index.html
          grep -q 'Newsroom Health' health/index.html
          grep -q 'Recent Headlines' recent/index.html
          test -s stories/index.html
          test -s archive/index.html
          test -s data/archive_index.json
          grep -q 'PERMANENT ARCHIVE' archive/index.html
          grep -q 'Archive' stories/index.html
          test -s feed.xml
          grep -q 'Rally Point News — Live Timelines' feed.xml
          test -s data/distribution_candidates.json
          grep -q '"auto_post_enabled": false' data/distribution_candidates.json
          grep -q '"ideology_used_in_selection": false' data/distribution_candidates.json
          grep -q '"same_event_duplicate_promotion_suppressed": true' data/distribution_candidates.json
          grep -q 'utm_campaign=live_timeline' data/distribution_candidates.json
          grep -q 'application/rss+xml' index.html
          grep -q 'More live timelines' stories/*/index.html
          test -s assets/timeline-state.js
          test -s assets/following.js
          test -s following/index.html
          grep -q 'Your Stories' following/index.html
          grep -q 'data-follow-control' stories/*/index.html
          test -s data/server_follows.json
          test -s data/notification_queue.json
          test -s data/notification_health.json
          test -s notification-health/index.html
          grep -q 'Repository queue delivery is disabled' notification-health/index.html
          grep -q '"delivery_enabled": false' data/notification_queue.json
          test -s data/email_pilot_config.json
          test -s data/email_delivery_health.json
          test -s assets/email-opt-in.js
          grep -q 'data-email-pilot hidden' stories/*/index.html
          ! grep -Eq '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}' data/email_delivery_health.json data/notification_health.json data/notification_queue.json
          grep -q 'Live News Timelines' stories/index.html
          grep -q 'G-KKT59K667B' stories/index.html
          grep -q 'G-KKT59K667B' recent/index.html
          grep -q 'https://rallypointnews.com/stories/' sitemap.xml
          ! grep -q 'https://rallypointnews.com/recent/' sitemap.xml
          grep -q 'https://rallypointnews.com/archive/' sitemap.xml
          grep -q 'https://rallypointnews.com/about/' sitemap.xml
          grep -q 'https://rallypointnews.com/sources/' sitemap.xml
          grep -q '^Sitemap: https://rallypointnews.com/sitemap.xml$' robots.txt
          grep -q 'Live News Timelines & Breaking Headlines' scripts/install_discovery_metadata.py
          grep -q 'history_dates.get(page.parent.name)' scripts/build_sitemaps.py
      - name: Enforce newsroom health gate
        run: python scripts/run_newsroom.py --assert-healthy
      - name: Commit fresh timelines and homepage when changed
        run: |
          python scripts/stage_publication.py
          if git diff --cached --quiet; then
            echo "No headline or discovery changes."
            exit 0
          fi
          git config user.name "rally-point-wire[bot]"
          git config user.email "rally-point-wire[bot]@users.noreply.github.com"
          git commit -m "Refresh live timelines"
          git fetch origin main
          PARENT_SHA="$(git rev-parse HEAD^)"
          REMOTE_SHA="$(git rev-parse origin/main)"
          if [ "$PARENT_SHA" != "$REMOTE_SHA" ]; then
            echo "main advanced during this refresh; skipping stale push."
            exit 0
          fi
          git push origin HEAD:main
      - name: Hand off to next Fast Wire cycle
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # repository_dispatch is the single authoritative clock. Cron recovery
          # lives in wire-watchdog.yml so it never competes in this queue.
          sleep 240
          curl --fail-with-body -L             -X POST             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${{ github.repository }}/dispatches"             -d '{"event_type":"fast_wire_tick"}'
