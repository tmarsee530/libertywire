name: Rally Brief Delivery

on:
  push:
    branches: [main]
    paths:
      - 'data/newsletter_ready.json'
      - 'scripts/send_newsletter_kit.py'
      - '.github/workflows/newsletter-delivery.yml'
  schedule:
    - cron: '15 12 * * *'
    - cron: '15 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rally-brief-delivery
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Schedule approved newsletter in Kit
        env:
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
        run: python scripts/send_newsletter_kit.py
      - name: Persist delivery state
        run: |
          if [ -z "$(git status --porcelain -- data/newsletter_state.json)" ]; then
            echo "Newsletter delivery state is unchanged."
            exit 0
          fi
          git config user.name "rally-point-newsroom[bot]"
          git config user.email "rally-point-newsroom[bot]@users.noreply.github.com"
          git add data/newsletter_state.json
          git commit -m "Record Rally Brief delivery"
          git fetch origin main
          if [ "$(git rev-parse HEAD^)" != "$(git rev-parse origin/main)" ]; then
            git rebase origin/main
          fi
          git push origin HEAD:main
