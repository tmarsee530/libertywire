name: Fast Wire Watchdog

on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  recover-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Recover Fast Wire only when its lease is stale
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUNS="$(curl --fail-with-body -sS -L \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/wire-fast.yml/runs?per_page=10")"
          ACTIVE="$(jq '[.workflow_runs[] | select(.status == "queued" or .status == "in_progress" or .status == "pending")] | length' <<<"$RUNS")"
          if [ "$ACTIVE" -gt 0 ]; then
            echo "Fast Wire has an active lease; watchdog is idle."
            exit 0
          fi
          HEALTH_RESPONSE="$(curl --fail-with-body -sS -L \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/contents/data/newsroom_health.json?ref=main")"
          HEALTH="$(jq -r '.content' <<<"$HEALTH_RESPONSE" | tr -d '\n' | base64 --decode)"
          COMPLETED="$(jq -r '.cycle.completed_at // empty' <<<"$HEALTH")"
          CORE_BAD="$(jq '[.stages | to_entries[] | select(.key == "ingestion" or .key == "clustering" or .key == "history" or .key == "publication" or .key == "homepage") | select(.value.status != "HEALTHY" and .value.status != "RECOVERED")] | length' <<<"$HEALTH")"
          if [ -n "$COMPLETED" ]; then
            AGE="$(( $(date -u +%s) - $(date -u -d "$COMPLETED" +%s) ))"
          else
            AGE=999999
          fi
          if [ "$AGE" -lt 600 ] && [ "$CORE_BAD" -eq 0 ]; then
            echo "Verified publication is fresh (${AGE}s) and all core stages are healthy; watchdog is idle."
            exit 0
          fi
          echo "Verified publication is stale or unhealthy (age=${AGE}s, bad_core_stages=${CORE_BAD}); dispatching one recovery tick."
          curl --fail-with-body -sS -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/dispatches" \
            -d '{"event_type":"fast_wire_tick","client_payload":{"source":"cron_watchdog"}}'
